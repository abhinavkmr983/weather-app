<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1 class="app-title">Weather App</h1>

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city name..." autocomplete="off" />
      <button id="searchBtn">Search</button>
    </div>

    <p class="error-msg" id="errorMsg"></p>

    <div class="weather-card" id="weatherCard">
      <div class="city-info">
        <h2 id="cityName">New Delhi</h2>
        <p id="countryName">India</p>
      </div>
      <div class="temp-box">
        <span id="weatherIcon">☀️</span>
        <h1 id="temperature">32°C</h1>
      </div>
      <p id="description">Clear Sky</p>
      <div class="details-grid">
        <div class="detail-item">
          <span class="label">Feels Like</span>
          <span id="feelsLike">35°C</span>
        </div>
        <div class="detail-item">
          <span class="label">Humidity</span>
          <span id="humidity">60%</span>
        </div>
        <div class="detail-item">
          <span class="label">Wind Speed</span>
          <span id="windSpeed">12 km/h</span>
        </div>
        <div class="detail-item">
          <span class="label">Condition</span>
          <span id="condition">Sunny</span>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
